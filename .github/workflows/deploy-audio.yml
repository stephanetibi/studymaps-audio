# Publishes the audio/ folder to studymaps.org/audio/ on the InMotion server (21 Nov 2026).
# Runs on every push to main that changes audio/, or by hand (Actions tab, "Run workflow").
# Credentials live only in this repository's encrypted secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# (FTP account githubdeploy@studymaps.org, the same one the studymaps.org repository uses).
# Only audio/ is published; nothing else on the server is touched. Files deleted here are NOT deleted on the server.
name: Deploy audio to studymaps.org/audio
on:
  push:
    branches: [main]
    paths: ['audio/**', '.github/workflows/deploy-audio.yml']
  workflow_dispatch:
concurrency:
  group: deploy-audio
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload audio/ over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./audio/
          server-dir: ./audio/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
